<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">DenseFrame capture pipeline banner</title>
  <desc id="desc">Original concept banner showing local Android scan to DFR raw project to point cloud to mesh and GLB roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset="0.55" stop-color="#101722"/>
      <stop offset="1" stop-color="#081D21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5FE1C8"/>
      <stop offset="1" stop-color="#7AA7FF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#5FE1C8" stroke-width="1">
    <path d="M0 320 C210 260 320 350 520 285 S900 185 1280 250"/>
    <path d="M0 360 C240 300 420 370 620 315 S980 230 1280 290"/>
  </g>
  <g transform="translate(86 76)">
    <text x="0" y="0" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="780">DenseFrame</text>
    <text x="0" y="44" fill="#B8C6DA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Scan locally. Save raw. Reconstruct deterministically.</text>
  </g>
  <g transform="translate(90 190)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect width="190" height="112" rx="16" fill="#101722" stroke="#2A374A"/>
      <text x="24" y="38" fill="#F4F8FF" font-size="21" font-weight="720">Android Scan</text>
      <text x="24" y="69" fill="#9FB0C8" font-size="15">ARCore depth frames</text>
      <path d="M138 70 L162 58 L162 86 L138 74 Z" fill="none" stroke="#5FE1C8" stroke-width="3"/>
    </g>
    <path d="M214 56 H278" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(302 0)">
      <rect width="190" height="112" rx="16" fill="#101722" stroke="#2A374A"/>
      <text x="24" y="38" fill="#F4F8FF" font-size="21" font-weight="720">DFR Raw</text>
      <text x="24" y="69" fill="#9FB0C8" font-size="15">Manifests + checksums</text>
      <path d="M134 30 H162 V84 H126 V48 Z" fill="none" stroke="#7AA7FF" stroke-width="3"/>
    </g>
    <path d="M516 56 H580" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(604 0)">
      <rect width="190" height="112" rx="16" fill="#101722" stroke="#2A374A"/>
      <text x="24" y="38" fill="#F4F8FF" font-size="21" font-weight="720">Point Cloud</text>
      <text x="24" y="69" fill="#9FB0C8" font-size="15">Local MVP output</text>
      <g fill="#5FE1C8">
        <circle cx="125" cy="38" r="3"/><circle cx="148" cy="42" r="3"/><circle cx="137" cy="64" r="3"/><circle cx="164" cy="70" r="3"/><circle cx="116" cy="78" r="3"/>
      </g>
    </g>
    <path d="M818 56 H882" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(906 0)">
      <rect width="190" height="112" rx="16" fill="#101722" stroke="#2A374A"/>
      <text x="24" y="38" fill="#F4F8FF" font-size="21" font-weight="720">Mesh / GLB</text>
      <text x="24" y="69" fill="#9FB0C8" font-size="15">Roadmap export path</text>
      <path d="M130 76 L150 36 L170 76 Z" fill="none" stroke="#F4F8FF" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
